<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- 헤더 -->
    <header>
      <div class="inner">
        <a href="#" class="logo">JEJUDO</a>
        <nav class="nav">
          <ul>
            <li><a href="">Nowda</a></li>
            <li><a href="">Travel Info</a></li>
            <li><a href="">Destinations</a></li>
          </ul>
          <div class="x">✖</div>
        </nav>
      </div>
    </header>
    <!-- 메인 -->
    <main>
      <div class="inner">
        <div class="banner">
          <img src="images/hello-jeju.png" alt="jejudo-banner" />
          <div class="banner-title">
            <p>
              Discover Korea's Islands <br />
              Jeju Travel Specials
            </p>
            <button class="banner-btn">아이콘</button>
          </div>
        </div>
        <div class="static-view">
          <div class="icons"><i class="fa-brands fa-kakao-talk"></i><i class="fa-brands fa-youtube-shorts"></i></div>
          <div class="sign">
            <a href="#">Sign in</a>
            <a href="#">Sign up</a>
          </div>
        </div>
        <section class="swiper-zone"></section>
        <section class="jejutripplan"></section>
      </div>
    </main>
    <!-- 푸터 -->
    <footer>
      <div class="inner">
        <p></p>
        <hr />
        <p></p>
      </div>
    </footer>
  </body>
</html>
